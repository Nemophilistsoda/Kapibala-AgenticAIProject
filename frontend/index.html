<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KapibalaAI — 获客初筛 Agent</title>
<!-- 字体：英文 Times New Roman 斜体+加粗（系统自带）；中文 思源宋体 Noto Serif SC
     （ upright 不随英文倾斜，靠 font-synthesis-style:none 实现）。
     本机装了 Adobe 字体/思源宋体时优先本地版；CDN 挂了回退 Georgia/系统字体 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@latest/400.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@latest/700.css" />
<!--
  KapibalaAI 前端（单文件，Claude 桌面暗色风格，无构建步骤，无 mock）
  后端：uv run kapibala-agent serve 后访问 http://127.0.0.1:8000/
  边界不变：聊天框只调 /api/chat；REACTIVATE 走独立的 /api/admin/reactivate；
  无轮询、无自动重试、无流式、无 key。
-->
<style>
  :root {
    --bg: #1a1a1a;
    --bg-chat: #1e1e1e;
    --bg-card: #252525;
    --bg-hover: #2a2a2a;
    --border: #333333;
    --border-soft: #2a2a2a;
    --text: #f5f3ee;
    --text-2: #9a958d;
    --text-3: #555555;
    --brand: #c96442;
    --warn: #c0392b;
    --amber: #e8a020;
    --user-bubble: #2f2f2f;
    --user-bubble-border: #3a3a3a;
    --font-body: "Times New Roman", Georgia, "Noto Serif SC", "Source Han Serif SC", "PingFang SC", "Microsoft YaHei", serif;
    --font-label: "Times New Roman", Georgia, "Noto Serif SC", serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    /* 英文：Times New Roman 斜体（系统自带真斜体面），常规粗细——太粗反而难读。
       font-synthesis-style:none 关掉样式合成——思源宋体没有斜体面，
       这样汉字不会跟着被假斜体歪掉，保持直立。 */
    font-style: italic;
    font-weight: 400;
    font-synthesis-style: none;
    display: flex;
  }

  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ============ 三栏骨架 ============ */
  .app { display: flex; width: 100vw; height: 100vh; }

  /* ============ 左侧导航 ============ */
  .sidebar {
    width: 220px; flex-shrink: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    padding: 12px 10px;
  }
  .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
  .tab {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 7px 0; border: 0; border-radius: 999px;
    background: transparent; color: var(--text-2); font-size: 14px;
    transition: background 150ms ease, color 150ms ease;
  }
  .tab svg { width: 14px; height: 14px; }
  .tab:hover { background: var(--bg-hover); }
  .tab.active { background: var(--bg-hover); color: var(--text); }

  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px; border-radius: 6px;
    color: var(--text-2); font-size: 14px;
    cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left;
    transition: background 150ms ease, color 150ms ease;
  }
  .nav-item svg { width: 15px; height: 15px; flex-shrink: 0; }
  .nav-item:hover { background: var(--bg-hover); color: var(--text); }
  .nav-item.selected { background: var(--bg-hover); color: var(--text); }
  .nav-item .plus { color: var(--text); }

  .nav-divider {
    margin: 16px 10px 8px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--text-3);
  }
  .nav-divider svg { width: 12px; height: 12px; }

  .sidebar .grow { flex: 1; }

  .user-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px; border-radius: 6px; cursor: pointer;
    transition: background 150ms ease;
  }
  .user-row:hover { background: var(--bg-hover); }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: grid; place-items: center;
    font-size: 13px; font-weight: 600; flex-shrink: 0;
  }
  .user-name { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-tag { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .user-row svg { width: 13px; height: 13px; color: var(--text-3); flex-shrink: 0; }

  /* ============ 中间聊天区 ============ */
  .chat-main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    background: var(--bg-chat);
  }
  .flex-spacer { flex: 0 0 0; }
  .chat-main[data-empty="true"] .flex-spacer { flex: 1 1 0; }
  .chat-main[data-empty="true"] .messages { display: none; }
  .chat-main[data-empty="false"] .welcome { display: none; }

  .welcome {
    text-align: center; padding: 0 24px;
  }
  .welcome h1 {
    font-size: 40px; font-weight: 600; color: var(--text);
    letter-spacing: 0.01em;
  }
  .welcome h1 .mark { color: var(--brand); }
  .welcome p { margin-top: 14px; font-size: 18px; color: var(--text-2); }

  .messages {
    flex: 1 1 0; overflow-y: auto;
    padding: 24px 24px 8px;
    scroll-behavior: smooth;
  }
  .msg-col { max-width: 880px; margin: 0 auto; }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .msg { animation: fadeInUp 120ms ease-out; margin-bottom: 18px; }

  .msg.user { display: flex; justify-content: flex-end; }
  .msg.user .bubble {
    max-width: 70%;
    background: var(--brand);
    border: 1px solid #b85a3a;
    color: #ffffff;
    border-radius: 18px;
    padding: 12px 18px;
    font-size: 16px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.agent { max-width: 75%; }
  .msg.agent .label {
    font-size: 12px; color: var(--text-3);
    font-family: var(--font-label);
    letter-spacing: 0.08em; margin-bottom: 4px;
  }
  .msg.agent .text { font-size: 16px; line-height: 1.75; word-break: break-word; }
  .msg.agent .text p { margin: 0 0 8px; }
  .msg.agent .text p:last-child { margin-bottom: 0; }
  .msg.agent .text ul, .msg.agent .text ol { margin: 0 0 8px; padding-left: 22px; }
  .msg.agent .text li { margin-bottom: 4px; }
  .msg.agent .text h1, .msg.agent .text h2, .msg.agent .text h3 { margin: 6px 0 8px; line-height: 1.4; }
  .msg.agent .text h1 { font-size: 19px; }
  .msg.agent .text h2 { font-size: 18px; }
  .msg.agent .text h3 { font-size: 17px; }
  .msg.agent .text code {
    background: #2a2a2a; border: 1px solid var(--border); border-radius: 4px;
    padding: 1px 5px; font-family: var(--font-label); font-size: 13.5px;
  }
  .msg.agent .text pre {
    background: #232323; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: 0 0 8px;
  }
  .msg.agent .text pre code { background: none; border: 0; padding: 0; }
  .msg.agent .text a { color: #d9744f; }

  .sys-line {
    text-align: center;
    font-family: var(--font-label); font-size: 13px;
    color: var(--text-3);
    border: 1px dashed var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    max-width: 80%; margin: 0 auto 18px;
    line-height: 1.6;
  }
  .sys-line.warn { color: var(--warn); border-color: rgba(192,57,43,0.45); }

  /* ============ 输入卡 ============ */
  .composer-wrap { padding: 12px 24px 20px; }
  .composer {
    max-width: 880px; margin: 0 auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 14px 10px;
    transition: border-color 150ms ease;
  }
  .composer:focus-within { border-color: var(--text-3); }
  .composer textarea {
    width: 100%; min-height: 64px; max-height: 200px;
    background: transparent; border: 0; outline: none; resize: none;
    color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  }
  .composer textarea::placeholder { color: var(--text-3); }
  .composer-bar {
    display: flex; align-items: center; gap: 8px; margin-top: 8px;
  }
  .icon-mini {
    width: 28px; height: 28px; border-radius: 8px;
    border: 0; background: transparent; color: var(--text-2);
    display: grid; place-items: center;
    transition: background 150ms ease, color 150ms ease;
  }
  .icon-mini:hover { background: var(--bg-hover); color: var(--text); }
  .icon-mini svg { width: 15px; height: 15px; }
  .chip {
    font-size: 13px; color: var(--text);
    background: var(--border); border-radius: 999px;
    padding: 4px 12px;
  }
  .cust-input {
    background: transparent;
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-family: var(--font-label); font-size: 13px;
    padding: 5px 8px; width: 130px; outline: none;
    transition: border-color 150ms ease;
  }
  .cust-input:focus { border-color: var(--text-3); }
  .composer-bar .grow { flex: 1; }
  .model-tag { font-size: 13px; color: var(--text-2); }
  .send-btn {
    width: 28px; height: 28px; border-radius: 50%;
    border: 0; background: var(--brand); color: #fff;
    display: grid; place-items: center;
    transition: opacity 150ms ease, transform 150ms ease, background 150ms ease;
  }
  .send-btn svg { width: 14px; height: 14px; }
  .send-btn:hover:not(:disabled) { background: #d9744f; transform: translateY(-1px); }
  .send-btn:disabled { opacity: 0.4; cursor: wait; }

  /* ============ 右侧系统面板 ============ */
  .sys-panel {
    width: 260px; flex-shrink: 0;
    background: var(--bg);
    border-left: 1px solid var(--border-soft);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .lang-section { padding: 10px 16px; }
  .lang-sel {
    width: 100%;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-2);
    font-family: var(--font-label);
    font-size: 12px;
    padding: 5px 8px;
    outline: none;
    cursor: pointer;
    transition: border-color 150ms ease, color 150ms ease;
  }
  .lang-sel:hover, .lang-sel:focus { border-color: var(--text-3); color: var(--text); }
  .lang-sel option { background: var(--bg); color: var(--text); }
  .panel-section { padding: 14px 16px; border-bottom: 1px solid var(--border-soft); }
  .section-title {
    font-size: 12px; color: var(--text-3);
    font-family: var(--font-label);
    letter-spacing: 0.12em; margin-bottom: 10px;
  }

  .state-value {
    font-size: 19px; letter-spacing: 0.06em; color: var(--text);
    font-weight: 600;
  }
  .state-value.escalated { color: var(--warn); }
  .state-value.closed { color: var(--text-2); }

  .meter-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .meter-label { font-size: 12px; color: var(--text-3); font-family: var(--font-label); }
  .meter-num { font-size: 13px; font-family: var(--font-label); color: var(--text); }
  .meter-num.warn { color: var(--amber); }
  .meter-num.danger { color: var(--warn); }

  .pixel-bar { display: flex; gap: 4px; margin-bottom: 14px; }
  .pixel-bar .seg { flex: 1; height: 4px; border-radius: 2px; background: var(--bg-hover); transition: background 300ms; }
  .pixel-bar .seg.on1 { background: var(--amber); }
  .pixel-bar .seg.on2 { background: var(--warn); }

  .last-action { font-size: 13px; font-family: var(--font-label); color: var(--text); }
  .last-reason { font-size: 10px; color: var(--text-3); word-break: break-all; line-height: 1.5; margin-top: 4px; }

  .log-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; padding-bottom: 0; }
  .mini-log { flex: 1; overflow-y: auto; padding-bottom: 10px; }
  .log-entry {
    font-size: 10px; font-family: var(--font-label);
    color: var(--text-2); line-height: 1.8;
    word-break: break-all;
  }
  .log-entry .ts { color: var(--text-3); margin-right: 6px; }
  .log-entry.warn { color: var(--warn); }
  .log-entry.err { color: var(--warn); }

  .operator-section { border-bottom: 0; }
  .op-btn {
    width: 100%; padding: 8px;
    font-size: 12px; font-family: var(--font-label);
    text-transform: uppercase; letter-spacing: 0.08em;
    border-radius: 6px;
    background: transparent;
    transition: background 150ms ease, color 150ms ease, border-color 150ms ease;
    margin-bottom: 8px;
  }
  .op-btn.reactivate { border: 1px solid var(--user-bubble-border); color: var(--warn); }
  .op-btn.reactivate:hover { background: #2a1a1a; }
  .op-btn.clear { border: 1px solid var(--border-soft); color: var(--text-3); margin-bottom: 0; }
  .op-btn.clear:hover { color: var(--text-2); }

  @media (max-width: 900px) {
    .sidebar { display: none; }
    .sys-panel { display: none; }
  }
</style>
</head>
<body>
<div class="app">

  <!-- ============ 左侧导航 ============ -->
  <aside class="sidebar">
    <div class="tabs">
      <button class="tab active" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">        <path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
        <span data-i18n="home">首页</span>
      </button>
      <button class="tab" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 8-4 4 4 4"/><path d="m16 8 4 4-4 4"/><path d="m13.5 5-3 14"/></svg>
        <span data-i18n="code">代码</span>
      </button>
    </div>

    <button class="nav-item selected" type="button">
      <svg class="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="new">新建</span>
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>
      <span data-i18n="projects">项目</span>
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M6 3h12l4 6-10 12L2 9l4-6z"/><path d="M2 9h20M9 3l3 6 3-6M12 21 9 9m6 0-3 12"/></svg>
      <span data-i18n="artifacts">Artifacts</span>
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
      <span data-i18n="tasks">计划任务</span>
    </button>
    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <span data-i18n="customize">自定义</span>
    </button>

    <div class="nav-divider">
      <span data-i18n="chatsDivider">Chats and tasks &gt;</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 8h10M18 8h2M4 16h2M10 16h10"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/></svg>
    </div>

    <div class="grow"></div>

    <button class="nav-item" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.5 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.5-2-1.5c.1-.4.1-.8.1-1.2z"/></svg>
      <span data-i18n="settings">设置</span>
    </button>
    <div class="user-row">
      <div class="avatar">D</div>
      <span class="user-name" id="userLogin">demo-customer</span>
      <span class="user-tag" data-i18n="demoTag">· 演示版</span>
      <span class="grow" style="flex:1"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m0 0L7 8m5-5 5 5"/><path d="M5 15v4a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/></svg>
    </div>
  </aside>

  <!-- ============ 中间聊天区 ============ -->
  <main class="chat-main" id="chatMain" data-empty="true">
    <div class="flex-spacer" aria-hidden="true"></div>

    <div class="welcome" id="welcome">
      <h1><span class="mark">✳</span> KapibalaAI <span id="titleText">获客初筛</span></h1>
      <p id="welcomeSubtitle">今天有什么我可以帮您的？</p>
    </div>

    <div class="messages" id="messages">
      <div class="msg-col" id="msgCol"></div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="form">
        <textarea id="msgInput" placeholder="输入客户消息…" maxlength="2000"></textarea>
        <div class="composer-bar">
          <button class="icon-mini" type="button" title="装饰按钮">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <span class="chip" id="chipLabel">聊天</span>
          <input class="cust-input" id="custId" value="demo-customer" spellcheck="false" title="customer_id" />
          <span class="grow"></span>
          <span class="model-tag">gemini-flash</span>
          <button class="send-btn" id="sendBtn" type="submit" title="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5m0 0-6 6m6-6 6 6"/></svg>
          </button>
        </div>
      </form>
    </div>

    <div class="flex-spacer" aria-hidden="true"></div>
  </main>

  <!-- ============ 右侧系统面板 ============ -->
  <aside class="sys-panel">
    <div class="panel-section lang-section">
      <select class="lang-sel" id="langSel" title="UI language / 界面语言">
        <option value="zh">中文</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
    </div>
    <div class="panel-section">
      <div class="section-title" id="stState">SESSION STATE</div>
      <div class="state-value" id="stateValue">ACTIVE</div>
    </div>

    <div class="panel-section">
      <div class="section-title" id="stCounter">ANOMALY COUNTER</div>
      <div class="meter-row">
        <span class="meter-label" id="lblCount">COUNT</span>
        <span class="meter-num" id="anomalyVal">0</span>
      </div>
      <div class="pixel-bar">
        <div class="seg" id="seg0"></div>
        <div class="seg" id="seg1"></div>
      </div>

      <div class="section-title" id="stLast">LAST ACTION</div>
      <div class="last-action" id="lastAction">—</div>
      <div class="last-reason" id="lastReason"></div>
    </div>

    <div class="panel-section log-section">
      <div class="section-title" id="stLog">EVENT LOG</div>
      <div class="mini-log" id="miniLog"></div>
    </div>

    <div class="panel-section operator-section">
      <div class="section-title" id="stOp">OPERATOR</div>
      <button class="op-btn reactivate" id="reactivateBtn" type="button">⟳ Reactivate Session</button>
      <button class="op-btn clear" id="clearBtn" type="button">✕ Clear Display</button>
    </div>
  </aside>

</div>

<script>
(function () {
  "use strict";

  var API = {
    chat: "/api/chat",
    reactivate: "/api/admin/reactivate"
  };

  var chatMain   = document.getElementById("chatMain");
  var messages   = document.getElementById("messages");
  var msgCol     = document.getElementById("msgCol");
  var form       = document.getElementById("form");
  var msgInput   = document.getElementById("msgInput");
  var sendBtn    = document.getElementById("sendBtn");
  var custId     = document.getElementById("custId");
  var userLogin  = document.getElementById("userLogin");
  var stateValue = document.getElementById("stateValue");
  var anomalyVal = document.getElementById("anomalyVal");
  var lastAction = document.getElementById("lastAction");
  var lastReason = document.getElementById("lastReason");
  var miniLog    = document.getElementById("miniLog");
  var seg0       = document.getElementById("seg0");
  var seg1       = document.getElementById("seg1");
  var reactivateBtn = document.getElementById("reactivateBtn");
  var clearBtn   = document.getElementById("clearBtn");
  var langSel    = document.getElementById("langSel");
  var titleText  = document.getElementById("titleText");
  var welcomeSubtitle = document.getElementById("welcomeSubtitle");
  var chipLabel  = document.getElementById("chipLabel");
  var stState    = document.getElementById("stState");
  var stCounter  = document.getElementById("stCounter");
  var stLast     = document.getElementById("stLast");
  var stLog      = document.getElementById("stLog");
  var stOp       = document.getElementById("stOp");
  var lblCount   = document.getElementById("lblCount");

  /* ---- UI 多语言：只翻译界面文案，不参与任何决策逻辑 ---- */
  var I18N = {
    zh: { title: "获客初筛", subtitle: "今天有什么我可以帮您的？", placeholder: "输入客户消息…", chip: "聊天",
          state: "SESSION STATE", counter: "ANOMALY COUNTER", last: "LAST ACTION", log: "EVENT LOG", op: "OPERATOR",
          count: "COUNT", reactivate: "⟳ 重新激活会话", clear: "✕ 清空显示",
          home: "首页", code: "代码", "new": "新建", projects: "项目", artifacts: "Artifacts",
          tasks: "计划任务", customize: "自定义", chatsDivider: "Chats and tasks >", settings: "设置", demoTag: "· 演示版" },
    en: { title: "Lead Qualifier", subtitle: "How can I help you today?", placeholder: "Type a customer message…", chip: "Chat",
          state: "SESSION STATE", counter: "ANOMALY COUNTER", last: "LAST ACTION", log: "EVENT LOG", op: "OPERATOR",
          count: "COUNT", reactivate: "⟳ Reactivate session", clear: "✕ Clear display",
          home: "Home", code: "Code", "new": "New", projects: "Projects", artifacts: "Artifacts",
          tasks: "Tasks", customize: "Customize", chatsDivider: "Chats and tasks >", settings: "Settings", demoTag: "· Demo" },
    ja: { title: "リードスクリーニング", subtitle: "本日はどのようなご用件でしょうか？", placeholder: "お客様のメッセージを入力…", chip: "チャット",
          state: "セッション状態", counter: "異常カウンター", last: "最後のアクション", log: "イベントログ", op: "オペレーター",
          count: "回数", reactivate: "⟳ セッションを再アクティブ化", clear: "✕ 表示をクリア",
          home: "ホーム", code: "コード", "new": "新規", projects: "プロジェクト", artifacts: "アーティファクト",
          tasks: "タスク", customize: "カスタマイズ", chatsDivider: "チャットとタスク >", settings: "設定", demoTag: "· デモ版" }
  };

  function applyI18n(lang) {
    var t = I18N[lang] || I18N.zh;
    titleText.textContent = t.title;
    welcomeSubtitle.textContent = t.subtitle;
    msgInput.placeholder = t.placeholder;
    chipLabel.textContent = t.chip;
    stState.textContent = t.state;
    stCounter.textContent = t.counter;
    stLast.textContent = t.last;
    stLog.textContent = t.log;
    stOp.textContent = t.op;
    lblCount.textContent = t.count;
    reactivateBtn.textContent = t.reactivate;
    clearBtn.textContent = t.clear;
    /* 左侧导航等装饰性文案：统一走 data-i18n 标记 */
    document.querySelectorAll("[data-i18n]").forEach(function (el) {
      var v = t[el.getAttribute("data-i18n")];
      if (v !== undefined) el.textContent = v;
    });
    document.documentElement.lang = lang === "zh" ? "zh-CN" : lang;
    try { localStorage.setItem("kb-lang", lang); } catch (e) { /* 隐私模式等场景静默忽略 */ }
  }

  var savedLang = "zh";
  try { savedLang = localStorage.getItem("kb-lang") || "zh"; } catch (e) { /* 忽略 */ }
  langSel.value = savedLang;
  applyI18n(savedLang);
  langSel.addEventListener("change", function () { applyI18n(langSel.value); });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---- 轻量 Markdown 渲染（先整体 HTML 转义再做转换，天然防注入） ---- */
  function inlineMd(t) {
    var codes = [];
    t = t.replace(/`([^`]+)`/g, function (_, c) {
      codes.push("<code>" + c + "</code>");
      return "\x00" + (codes.length - 1) + "\x00";
    });
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    t = t.replace(/\x00(\d+)\x00/g, function (_, i) { return codes[+i]; });
    return t;
  }

  function renderMarkdown(src) {
    var lines = esc(src).split(/\r?\n/);
    var html = [], para = [], codeBuf = [], listBuf = [], listType = null, inCode = false;
    function flushPara() {
      if (para.length) { html.push("<p>" + para.join("<br>") + "</p>"); para = []; }
    }
    function flushList() {
      flushPara();
      if (!listBuf.length) return;
      var tag = listType === "ol" ? "ol" : "ul";
      html.push("<" + tag + ">" + listBuf.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</" + tag + ">");
      listBuf = []; listType = null;
    }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      if (/^\s*```/.test(line)) {
        flushList();
        if (inCode) { html.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>"); codeBuf = []; inCode = false; }
        else { inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(line); continue; }
      var h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) {
        flushList();
        var lv = Math.min(h[1].length, 3);
        html.push("<h" + lv + ">" + inlineMd(h[2]) + "</h" + lv + ">");
        continue;
      }
      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      var ol = line.match(/^\s*\d+[.、]\s+(.*)$/);
      if (ul || ol) {
        flushPara();
        var type = ul ? "ul" : "ol";
        if (listType && listType !== type) flushList();
        listType = type;
        listBuf.push(inlineMd((ul || ol)[1]));
        continue;
      }
      if (!line.trim()) { flushList(); continue; }
      if (listType) flushList();
      para.push(inlineMd(line));
    }
    if (inCode && codeBuf.length) html.push("<pre><code>" + codeBuf.join("\n") + "</code></pre>");
    flushList();
    return html.join("");
  }

  function ts() {
    var n = new Date();
    return [n.getHours(), n.getMinutes(), n.getSeconds()]
      .map(function (x) { return x < 10 ? "0" + x : "" + x; }).join(":");
  }
  function scrollBottom() { messages.scrollTop = messages.scrollHeight; }
  function currentId() { return custId.value.trim() || "demo-customer"; }

  custId.addEventListener("input", function () { userLogin.textContent = currentId(); });

  /* ---- 消息渲染 ---- */
  function addUser(text) {
    chatMain.dataset.empty = "false";
    var d = document.createElement("div");
    d.className = "msg user";
    d.innerHTML = '<div class="bubble"></div>';
    d.querySelector(".bubble").textContent = text;
    msgCol.appendChild(d);
    scrollBottom();
  }
  function addAgent(text) {
    var d = document.createElement("div");
    d.className = "msg agent";
    d.innerHTML = '<div class="label">AGENT</div><div class="text"></div>';
    d.querySelector(".text").innerHTML = renderMarkdown(text);
    msgCol.appendChild(d);
    scrollBottom();
  }
  function addSys(text, warn) {
    chatMain.dataset.empty = "false";
    var d = document.createElement("div");
    d.className = "sys-line" + (warn ? " warn" : "");
    d.textContent = (warn ? "⚠ " : "") + text;
    msgCol.appendChild(d);
    scrollBottom();
  }

  /* ---- 右侧面板 ---- */
  function logEvent(text, level) {
    var d = document.createElement("div");
    d.className = "log-entry" + (level ? " " + level : "");
    d.innerHTML = '<span class="ts">' + ts() + '</span>' + esc(text);
    miniLog.appendChild(d);
    miniLog.scrollTop = miniLog.scrollHeight;
  }
  function setState(status) {
    var s = (status || "active").toLowerCase();
    stateValue.textContent = s.toUpperCase();
    stateValue.className = "state-value" + (s === "escalated" ? " escalated" : s === "closed" ? " closed" : "");
  }
  function setAnomaly(n) {
    if (typeof n !== "number") return;
    anomalyVal.textContent = String(n);
    anomalyVal.className = "meter-num" + (n >= 2 ? " danger" : n === 1 ? " warn" : "");
    seg0.className = "seg" + (n >= 1 ? (n >= 2 ? " on2" : " on1") : "");
    seg1.className = "seg" + (n >= 2 ? " on2" : "");
  }
  function updatePanel(outcome) {
    setState(outcome.status);
    lastAction.textContent = (outcome.executed_action || "silent").toUpperCase();
    lastReason.textContent = (outcome.detail ? outcome.detail + " · " : "") + (outcome.reason || "");
    if (typeof outcome.anomaly_count === "number") {
      setAnomaly(outcome.anomaly_count);
    } else if (outcome.status === "escalated") {
      setAnomaly(2); /* 后端未带计数字段时的兜底近似 */
    }
  }

  /* ---- 结果渲染 ---- */
  function renderOutcome(o) {
    updatePanel(o);
    if (o.customer_visible_text) {
      addAgent(o.customer_visible_text);
      logEvent("reply_sent", "");
      return;
    }
    var reason = o.reason || "";
    if (!o.executed_action) {
      var warn = /rate_limited|denied|locked|escalat|failed/i.test(reason);
      addSys("[ SILENT ] " + reason + " · state=" + (o.status || "?"), warn);
      logEvent("silent: " + reason, warn ? "warn" : "");
      return;
    }
    if (o.executed_action === "reply") {
      addSys("[ REPLY ] no text returned · " + reason, false);
      logEvent("reply (no text)", "warn");
      return;
    }
    var isWarn = /escalat|not_interested/i.test(o.executed_action);
    /* 升级路径：two_consecutive_anomalies=计数器强制 / model_action_accepted=模型建议 */
    var pathMap = {
      two_consecutive_anomalies: "计数器强制（连续2次异常）",
      model_action_accepted: "模型建议被接受"
    };
    var path = o.detail ? (pathMap[o.detail] || o.detail) : "";
    addSys(
      "[ " + o.executed_action.toUpperCase() + " ]" + (path ? " " + path : "") +
        " · state=" + (o.status || "?") + " · " + reason,
      isWarn
    );
    logEvent(o.executed_action + (path ? " · " + path : "") + " · " + reason, isWarn ? "warn" : "");
  }

  /* ---- 发送（无轮询、失败不自动重试） ---- */
  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var message = msgInput.value.trim();
    if (!message || sendBtn.disabled) return;
    addUser(message);
    logEvent("customer: " + message.slice(0, 30) + (message.length > 30 ? "…" : ""), "");
    msgInput.value = "";
    sendBtn.disabled = true;

    fetch(API.chat, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: currentId(), message: message })
    })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (o) {
      renderOutcome(o);
      sendBtn.disabled = false;
      msgInput.focus();
    })
    .catch(function (e) {
      addSys("[ ERROR ] 后端请求失败：" + e.message + " · 确认已运行 uv run kapibala-agent serve", true);
      logEvent("backend error: " + e.message, "err");
      sendBtn.disabled = false;
    });
  });

  msgInput.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey) {
      ev.preventDefault();
      form.requestSubmit ? form.requestSubmit() : form.dispatchEvent(new Event("submit", { cancelable: true }));
    }
  });

  /* ---- Operator（独立入口） ---- */
  reactivateBtn.addEventListener("click", function () {
    var cid = currentId();
    fetch(API.reactivate, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ customer_id: cid })
    })
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (o) {
      setState(o.status || "active");
      setAnomaly(typeof o.anomaly_count === "number" ? o.anomaly_count : 0);
      lastAction.textContent = "REACTIVATED";
      lastReason.textContent = o.reason || "";
      addSys("[ OPERATOR ] 已重新激活 " + cid + " · state=" + (o.status || "active"), false);
      logEvent("operator: reactivate " + cid, "");
    })
    .catch(function (e) {
      addSys("[ ERROR ] reactivate 失败：" + e.message, true);
      logEvent("reactivate error: " + e.message, "err");
    });
  });

  clearBtn.addEventListener("click", function () {
    msgCol.innerHTML = "";
    chatMain.dataset.empty = "true";
    logEvent("display cleared (server state intact)", "");
  });

  msgInput.focus();
})();
</script>
