[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kapibala-agent"
version = "0.1.0"
description = "A policy-first lead qualification agent for the KapibalaAI internship exercise."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0,<3.0",
    "pydantic>=2.10,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
kapibala-agent = "kapibala_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kapibala_agent"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs", "references", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
